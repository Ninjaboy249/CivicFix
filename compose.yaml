services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: civicfix
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: civicfix
    ports:
      - "5432:5432"
    volumes:
      - civicfix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  civicfix_postgres_data:

