zerops:

  # =========================
  # BACKEND API
  # =========================
  - setup: api

    build:
      base: ubuntu/python@3.12

      buildCommands:
        - python -m pip install --target backend/vendor -r backend/requirements.txt

      deployFiles:
        - ./backend

    run:
      base: ubuntu/python@3.12

      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        ENVIRONMENT: production
        PYTHONPATH: backend/vendor
        DATABASE_URL: ${db_connectionString}

      start: python backend/start.py

      healthCheck:
        httpGet:
          port: 8000
          path: /api/health


  # =========================
  # FRONTEND
  # =========================
  - setup: web
    build:
      base: alpine/nodejs@24

      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
        - cp -r frontend/public frontend/.next/standalone/public
        - cp -r frontend/.next/static frontend/.next/standalone/.next/static

      deployFiles:
        - ./frontend/.next/standalone

      cache:
        - ./frontend/node_modules

    run:
      base: alpine/nodejs@24

      ports:
        - port: 3000
          httpSupport: true

      envVariables:
        NODE_ENV: production
        HOSTNAME: 0.0.0.0
        PORT: 3000

      start: node frontend/.next/standalone/server.js

      healthCheck:
        httpGet:
          port: 3000
          path: /
