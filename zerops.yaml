zerops:

  # =========================
  # BACKEND API
  # =========================
  - setup: api

    build:
      base: ubuntu/python@3.12

      buildCommands:
        - python -m pip install --target backend/vendor -r backend/requirements.txt

      deployFiles:
        - ./backend

    run:
      base: ubuntu/python@3.12

      ports:
        - port: 8000
          httpSupport: true

      envVariables:
        ENVIRONMENT: production
        PYTHONPATH: backend/vendor
        DATABASE_URL: ${db_connectionString}

      start: python backend/start.py

      healthCheck:
        httpGet:
          port: 8000
          path: /api/health


  # =========================
  # FRONTEND
  # =========================
  - setup: web
    build:
      base: alpine/nodejs@24

      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build

      deployFiles:
        - ./frontend

      cache:
        - ./frontend/node_modules

    run:
      base: alpine/nodejs@24

      ports:
        - port: 3000
          httpSupport: true

      envVariables:
        NODE_ENV: production

      start: cd frontend && npm start -- -H 0.0.0.0 -p 3000

      healthCheck:
        httpGet:
          port: 3000
          path: /
